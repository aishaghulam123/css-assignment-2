<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product card</title>

    <!-- font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- custom css -->

    <link rel="stylesheet" href="card.css">
</head>

<body>
    <div class="container">
        <div class="card">

            <div class="fruit">
                <div class="icon1"><i class="fa-solid fa-share-nodes"></i></div>
                <div class="icon2"><i class="fa-solid fa-heart"></i></div>


                <img src="./blueberries/blueberries.png" alt="blue berry">


                <div class="gallery">
                    <img class="small b1" src="./blueberries/front.png" alt="blueberries front">
                    <img class="small b2" src="./blueberries/sliced.png" alt="sliced blueberries">
                    <img class="small b3" src="./blueberries/top.png" alt="top of blueberry">
                    <img class="small b4" src="./blueberries/bottom.png" alt="bottom of blueberry">
                </div>

            </div>
            <div class="details">
                <h2>DELICIOUS BLUEBERRIES</h3>
                    <div class="details2">
                        <h4>COD 0077</h4>
                        <!-- <br><br> -->
                        <span>R$</span>
                        <h1>8.00$</h1>

                        <p>Benefits</p>
                        <li>Rich in nutrients</li>
                        <li>Heart health </li>
                        <li>Brain health </li>
                        <li>Blood sugar management</li>
                        <li>Digestive health</li>
                        <li>Exercise recovery</li>
                        <br>
                         <button >Add to cart</button>
                         <a href="./nextcard.html" target="_blank">Next card</a>



                    </div>

            </div>
        </div>
</div>

</body>

</html>

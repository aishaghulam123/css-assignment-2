<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe card</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />



    <link rel="stylesheet" href="nextcard.css">
</head>
<body>
    <div class="main">
    <div class="container">
        <div class="side">
            <img src="shoes.png" alt="shoe pic">
            <a href="./card.html"><i class="fa-solid fa-arrow-left-long"></i></a><i class="fa-solid fa-arrow-right-long"></i>
        </div>
        <div class="details">
            <h2>Airmax</h2>
            <span class="icon"><i class="fa-solid fa-magnifying-glass"></i>
                <i class="icon2 fa-solid fa-user"></i>
                <i class="icon3 fa-solid fa-cart-shopping"></i></span>
                <br><br><br><br><br>
                <h3>Winter collection</h3>
                <h1 class="h1">Men black sneakers</h1>
                <div class="word">
                <div class="price"><h3 >$150</h3>
                <del>$200</del></div>
                <h3 class="size">size</h3>
            <h5>7</h5>
            <h5 class="ei">8</h5>
            <h5 class="nine">9</h5>
            <h5 class="ten">10</h5>
            <h5 class="ele">11</h5>
            <h3 class="color">color</h3>
            <div class="circle yellow"></div>
            <div class="circle black"></div>
            <div class="circle blue"></div>
            <div class="last"></div>
               <div class="ic"> 
            <i class=" fa-solid fa-bag-shopping"></i> <p >buy now</p><i class= fa-solid fa-cart-shopping"></i> <p>Add to cart</p>
            </div>
            </div>
        </div>
    </div>


</div>
</body>
</html>
